name: WakaTime README

on:
  workflow_dispatch:

  schedule:
    - cron: "0 0 * * *"

permissions:
  contents: write

jobs:
  update-readme:
    name: Update README with WakaTime stats
    runs-on: ubuntu-latest

    steps:
      - name: Update README with WakaTime stats
        uses: athul/waka-readme@master
        with:
          WAKATIME_API_KEY: ${{ secrets.WAKATIME_API_KEY }}
          GH_TOKEN: ${{ github.token }}

          SHOW_TITLE: false
          SHOW_TIME: true
          SHOW_TOTAL: false

          TIME_RANGE: last_7_days
          LANG_COUNT: 5

          BLOCKS: "░▒▓█"
          CODE_LANG: txt
